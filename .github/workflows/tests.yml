name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    # Preserve the existing check name for any branch-protection rules.
    name: Java and Android (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run portable Swift, Java and Android interoperability checks
        # Pinned official Swift image; fresh fixtures shared across every stage.
        run: bash Scripts/test-portable-ci.sh

      - name: Verify Android APK packaging
        run: bash Android/test-package.sh

  tests:
    name: Swift, Java and Android
    # Finish active native validation; retain the newest pending commit per ref.
    # Linux still validates every push independently of the macOS runner queue.
    concurrency:
      group: ${{ github.workflow }}-macos-${{ github.ref }}
      cancel-in-progress: false
    # macos-15 now selects arm64; that pool failed to acquire runners before any
    # step ran. Keep the full macOS suite on the standard Intel pool with Xcode 26.3.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify Xcode and Swift
        run: |
          xcodebuild -version
          swift --version
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check browser and SSH concurrency
        id: concurrency
        run: ./Scripts/test.sh --filter 'BrowserCourseSessionTests|CloudSyncPresentationTests|CloudSSHTests'
      - name: Run tests
        run: bash Scripts/test-ci.sh
      - name: Verify macOS DMG packaging
        run: bash Scripts/test-dmg-ci.sh
      - name: Capture failing test backtrace
        if: failure() && steps.concurrency.outcome == 'failure'
        timeout-minutes: 5
        run: |
          test_bin="$(swift build --show-bin-path)"
          test_runner="$(xcrun --find xctest)"
          for bundle in "$test_bin"/*.xctest; do
            [[ -d "$bundle" ]] || continue
            xcrun lldb --batch \
              -o 'settings set frame-format "frame #${frame.index}: ${module.file.basename} ${function.name-without-args} ${line.file.basename}:${line.number}\n"' \
              -o run -k 'thread backtrace all' \
              -- "$test_runner" -XCTest 'StudyPlannerTests.BrowserCourseSessionTests,StudyPlannerTests.CloudSyncPresentationTests,StudySyncTests.CloudSSHTests' "$bundle"
          done
